<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary · secondary · ghost · accent · sizes" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: all 180ms cubic-bezier(.2,.7,.2,1); line-height: 1; letter-spacing: -.005em; }
  .btn-primary { background: #0E1116; color: #FAF6EE; }
  .btn-primary:hover { background: #1B1F26; }
  .btn-secondary { background: #FAF6EE; color: #0E1116; border-color: rgba(14,17,22,.18); }
  .btn-secondary:hover { background: #F1ECE0; }
  .btn-ghost { background: transparent; color: #0E1116; }
  .btn-ghost:hover { background: rgba(14,17,22,.05); }
  .btn-accent { background: #F5C518; color: #0E1116; border-color: rgba(14,17,22,.18); font-weight: 700; }
  .btn-accent:hover { background: #e8b911; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
  .btn-lg { padding: 14px 24px; font-size: 16px; border-radius: 12px; }
  h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; }
  .group + .group { margin-top: 16px; }
</style></head>
<body><div class="card">
  <div class="group">
    <h4>Variants</h4>
    <div class="row">
      <button class="btn btn-primary">Get in touch</button>
      <button class="btn btn-secondary">View work</button>
      <button class="btn btn-ghost">Read more</button>
      <button class="btn btn-accent">Reserve a slot</button>
    </div>
  </div>
  <div class="group">
    <h4>Sizes</h4>
    <div class="row">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-lg">Large</button>
    </div>
  </div>
</div></body></html>
