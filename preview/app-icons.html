<!doctype html>
<!-- @dsCard group="Brand" name="App icons & favicons" subtitle="Gold + ink app icons · favicon dark/outline" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: stretch; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tile .frame { padding: 18px; min-height: 130px; display: grid; place-items: center; }
  .tile .frame img.full { max-width: 100%; max-height: 110px; }
  .tile .frame .stack { display:flex; gap:14px; align-items:center; }
  .tile .label { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: #475; background: #fff; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="tile"><div class="frame"><img class="full" src="../icons/app-icon-gold-512.svg" alt=""></div><div class="label">App icon · gold</div></div>
    <div class="tile"><div class="frame"><img class="full" src="../icons/app-icon-ink-512.svg" alt=""></div><div class="label">App icon · ink</div></div>
    <div class="tile"><div class="frame"><div class="stack">
      <img src="../icons/favicon.svg" width="48" height="48">
      <img src="../icons/favicon.svg" width="32" height="32">
      <img src="../icons/favicon.svg" width="16" height="16">
    </div></div><div class="label">Favicon · dark</div></div>
    <div class="tile"><div class="frame"><div class="stack">
      <img src="../icons/favicon-light.svg" width="48" height="48">
      <img src="../icons/favicon-light.svg" width="32" height="32">
      <img src="../icons/favicon-light.svg" width="16" height="16">
    </div></div><div class="label">Favicon · outline</div></div>
  </div>
</div></body></html>
