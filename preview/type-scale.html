<!doctype html>
<!-- @dsCard group="Type" name="Type scale" subtitle="Tokens · 48 → 11 px" viewport="700x380" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .scale { display: flex; flex-direction: column; gap: 6px; }
  .ln { display: grid; grid-template-columns: 70px 90px 1fr; align-items: baseline; gap: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .ln:last-child { border: 0; }
  .ln .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .ln .tk { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="scale">
    <div class="ln"><span class="px">48 / 800</span><span class="tk">--fs-display</span><span style="font-weight:800;font-size:38px;letter-spacing:-1.1px;line-height:1.05">Display</span></div>
    <div class="ln"><span class="px">34 / 800</span><span class="tk">--fs-h1</span><span style="font-weight:800;font-size:30px;letter-spacing:-.6px">Heading 1</span></div>
    <div class="ln"><span class="px">28 / 700</span><span class="tk">--fs-h2</span><span style="font-weight:700;font-size:25px;letter-spacing:-.4px">Heading 2</span></div>
    <div class="ln"><span class="px">24 / 700</span><span class="tk">--fs-h3</span><span style="font-weight:700;font-size:22px">Heading 3</span></div>
    <div class="ln"><span class="px">18 / 500</span><span class="tk">--fs-h4</span><span style="font-weight:500;font-size:17px">Heading 4 · medium</span></div>
    <div class="ln"><span class="px">16 / 400</span><span class="tk">--fs-body</span><span style="font-size:15px">Body — default copy</span></div>
    <div class="ln"><span class="px">13 / 500</span><span class="tk">--fs-caption</span><span style="font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7a7a7a">Eyebrow / caption</span></div>
    <div class="ln"><span class="px">11 / 400</span><span class="tk">--fs-micro</span><span style="font-size:11px;color:#475">Micro · footnote · meta</span></div>
  </div>
</div></body></html>
