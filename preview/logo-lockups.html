<!doctype html>
<!-- @dsCard group="Brand" name="Logo · lockups" subtitle="Mark + wordmark · horizontal & vertical" viewport="700x360" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tile.ink { background: #0E1116; }
  .tile .frame { padding: 22px; min-height: 130px; display: grid; place-items: center; }
  .tile .frame img { max-width: 100%; max-height: 110px; display: block; }
  .tile .label { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: #475; background: #fff; }
  .tile.ink .label { background: var(--paper); border-top-color: transparent; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="tile"><div class="frame"><img src="../logos/07-lockup-horizontal-light.svg" alt=""></div><div class="label">Horizontal lockup · light</div></div>
    <div class="tile ink"><div class="frame"><img src="../logos/08-lockup-horizontal-dark.svg" alt=""></div><div class="label">Horizontal lockup · dark</div></div>
    <div class="tile"><div class="frame"><img src="../logos/09-lockup-vertical-light.svg" alt=""></div><div class="label">Vertical lockup · light</div></div>
    <div class="tile ink"><div class="frame"><img src="../logos/10-lockup-vertical-dark.svg" alt=""></div><div class="label">Vertical lockup · dark</div></div>
  </div>
</div></body></html>
