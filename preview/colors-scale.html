<!doctype html>
<!-- @dsCard group="Colors" name="Color scales" subtitle="Paper + Ink scales for inverse panels" viewport="700x280" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .scale { display:grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .step { border-radius: 10px; height: 92px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; }
  h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; }
  .group + .group { margin-top: 14px; }
</style></head>
<body><div class="card">
  <div class="group">
    <h4>Paper scale · warm neutrals</h4>
    <div class="scale">
      <div class="step" style="background:#FFFCF5;color:#0E1116"><b>Paper 50</b><span>#FFFCF5</span></div>
      <div class="step" style="background:#FAF6EE;color:#0E1116"><b>Paper 100</b><span>#FAF6EE</span></div>
      <div class="step" style="background:#F1ECE0;color:#0E1116"><b>Paper 200</b><span>#F1ECE0</span></div>
      <div class="step" style="background:#E4DECF;color:#0E1116"><b>Paper 300</b><span>#E4DECF</span></div>
      <div class="step" style="background:#C9C3B5;color:#0E1116"><b>Paper 400</b><span>#C9C3B5</span></div>
    </div>
  </div>
  <div class="group">
    <h4>Ink scale · for inverse panels</h4>
    <div class="scale">
      <div class="step" style="background:#2A2E36;color:#FAF6EE"><b>Ink 50</b><span>#2A2E36</span></div>
      <div class="step" style="background:#1B1F26;color:#FAF6EE"><b>Ink 100</b><span>#1B1F26</span></div>
      <div class="step" style="background:#14181F;color:#FAF6EE"><b>Ink 200</b><span>#14181F</span></div>
      <div class="step" style="background:#0E1116;color:#FAF6EE"><b>Ink 300</b><span>#0E1116</span></div>
      <div class="step" style="background:#07090C;color:#FAF6EE"><b>Ink 400</b><span>#07090C</span></div>
    </div>
  </div>
</div></body></html>
