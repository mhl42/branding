<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · 4 / 8 / 12 / 16 / 20 / 24 / 32 / 40 / 56 / 64 / 80" viewport="700x280" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .step { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; height: 92px; display: flex; flex-direction: column; justify-content: space-between; }
  .bar { background: var(--ink); border-radius: 6px; }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .t { font-size: 11px; color: var(--fg-3); letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="step"><div class="bar" style="height:4px;width:4px"></div><div><div class="t">s-1</div><div class="v">4px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:8px"></div><div><div class="t">s-2</div><div class="v">8px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:12px"></div><div><div class="t">s-3</div><div class="v">12px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:16px"></div><div><div class="t">s-4</div><div class="v">16px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:20px"></div><div><div class="t">s-5</div><div class="v">20px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:24px"></div><div><div class="t">s-6</div><div class="v">24px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:32px"></div><div><div class="t">s-8</div><div class="v">32px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:40px"></div><div><div class="t">s-10</div><div class="v">40px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:56px"></div><div><div class="t">s-14</div><div class="v">56px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:64px"></div><div><div class="t">s-16</div><div class="v">64px</div></div></div>
    <div class="step"><div class="bar" style="height:4px;width:80px"></div><div><div class="t">s-20</div><div class="v">80px</div></div></div>
    <div class="step" style="border-style:dashed"><div class="t">base</div><div class="v">4px grid</div></div>
  </div>
</div></body></html>
