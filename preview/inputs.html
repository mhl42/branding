<!doctype html>
<!-- @dsCard group="Components" name="Inputs" subtitle="Text · textarea · gold focus ring" viewport="700x260" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; }
  label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; display: block; margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  input[type="text"], textarea, select {
    width: 100%; box-sizing: border-box; font: 14px Inter, sans-serif;
    background: #fff; color: #0E1116;
    border: 1px solid rgba(14,17,22,.18); border-radius: 10px;
    padding: 11px 13px; transition: box-shadow 180ms, border-color 180ms;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: #0E1116; box-shadow: 0 0 0 3px rgba(245,197,24,.35);
  }
  .help { font-size: 12px; color: var(--fg-2); margin-top: 5px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="field">
      <label>Name</label>
      <input type="text" value="Stefan Beyer" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="text" placeholder="you@company.com" />
    </div>
  </div>
  <div class="field">
    <label>How can we help?</label>
    <textarea rows="3" placeholder="One paragraph is plenty. We'll reply with questions."></textarea>
    <div class="help">We read every message. Most answers come back within two working days.</div>
  </div>
</div></body></html>
