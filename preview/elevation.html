<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Border-first · shadows used sparingly · gold focus ring" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .ex { background: #fff; height: 100px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .ex.b1 { border: 1px solid var(--line); }
  .ex.b2 { border: 1px solid var(--line); box-shadow: 0 1px 0 rgba(14,17,22,.04), 0 1px 2px rgba(14,17,22,.04); }
  .ex.b3 { border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(14,17,22,.06); }
  .ex.b4 { background: #FAF6EE; box-shadow: 0 0 0 3px rgba(245,197,24,.35); }
  .lab { margin-top: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; text-align: center; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div><div class="ex b1">none</div><div class="lab">shadow-none</div></div>
    <div><div class="ex b2">·</div><div class="lab">shadow-1 hairline</div></div>
    <div><div class="ex b3">·</div><div class="lab">shadow-2 popover</div></div>
    <div><div class="ex b4">·</div><div class="lab">focus ring · gold</div></div>
  </div>
  <p style="margin:14px 2px 0;font-size:12px;color:var(--fg-2);text-wrap:pretty">Default cards use border + radius — <b>not</b> shadow. Reach for shadow-2 only on floating elements (popovers, dropdowns).</p>
</div></body></html>
