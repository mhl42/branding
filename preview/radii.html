<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="6 / 10 / 14 / 22 / 999" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .ex { background: #fff; border: 1px solid var(--line); height: 110px; display: grid; place-items: center; }
  .lab { margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); text-align: center; }
  .lab b { font-family: var(--font-sans); font-weight: 600; color: var(--ink); display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div><div class="ex" style="border-radius:6px"></div><div class="lab"><b>r-sm</b>6px · chips</div></div>
    <div><div class="ex" style="border-radius:10px"></div><div class="lab"><b>r-md</b>10px · inputs</div></div>
    <div><div class="ex" style="border-radius:14px"></div><div class="lab"><b>r-lg</b>14px · cards</div></div>
    <div><div class="ex" style="border-radius:22px"></div><div class="lab"><b>r-xl</b>22px · plates</div></div>
    <div><div class="ex" style="border-radius:999px;width:110px;justify-self:center"></div><div class="lab"><b>r-pill</b>999px · pills</div></div>
  </div>
</div></body></html>
