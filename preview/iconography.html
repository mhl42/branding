<!doctype html>
<!-- @dsCard group="Components" name="Iconography (Lucide)" subtitle="Substitution flagged · outline-first stroke 1.75" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .card { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .ic svg { width: 22px; height: 22px; color: #0E1116; stroke-width: 1.75; }
  .ic span { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="ic"><i data-lucide="shield-check"></i><span>shield-check</span></div>
    <div class="ic"><i data-lucide="bot"></i><span>bot</span></div>
    <div class="ic"><i data-lucide="search"></i><span>search</span></div>
    <div class="ic"><i data-lucide="file-text"></i><span>file-text</span></div>
    <div class="ic"><i data-lucide="terminal"></i><span>terminal</span></div>
    <div class="ic"><i data-lucide="git-branch"></i><span>git-branch</span></div>
    <div class="ic"><i data-lucide="arrow-right"></i><span>arrow-right</span></div>
    <div class="ic"><i data-lucide="external-link"></i><span>external-link</span></div>
  </div>
  <p style="margin:12px 2px 0;font-size:12px;color:var(--fg-2);text-wrap:pretty"><b>Substitution flagged.</b> The brand repo ships no UI icon set; Lucide is the closest match — outline-first, single stroke <code>1.75</code>, <code>currentColor</code>. Confirm or supply your own.</p>
  <script>lucide.createIcons();</script>
</div></body></html>
