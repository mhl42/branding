<!doctype html>
<!-- @dsCard group="Colors" name="Primary colors" subtitle="Ink · Paper · Don't-Panic Gold" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .sw { height: 110px; border-radius: 14px; border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .sw .name { font-weight: 700; font-size: 14px; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; opacity: .85; }
  .sw .role { font-size: 11px; opacity: .7; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="sw" style="background:#0E1116;color:#FAF6EE">
      <div class="name">Ink</div>
      <div><div class="hex">#0E1116</div><div class="role">strokes · type · dark bg</div></div>
    </div>
    <div class="sw" style="background:#FAF6EE;color:#0E1116">
      <div class="name">Paper</div>
      <div><div class="hex">#FAF6EE</div><div class="role">page · default surface</div></div>
    </div>
    <div class="sw" style="background:#F5C518;color:#0E1116">
      <div class="name">Don't-Panic Gold</div>
      <div><div class="hex">#F5C518</div><div class="role">single accent · sparingly</div></div>
    </div>
  </div>
</div></body></html>
