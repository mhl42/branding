<!doctype html>
<!-- @dsCard group="Brand" name="Social & email" subtitle="OG · LinkedIn · X · email signature · avatar" viewport="700x520" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .frame { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 0; overflow: hidden; }
  .frame img { display: block; width: 100%; height: auto; }
  .frame.center { padding: 14px; display: grid; place-items: center; }
  .frame.center img { width: auto; max-height: 110px; }
  .meta { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="stack">
    <div class="frame"><img src="../social/og-image-1200x630.svg" alt=""><div class="meta">OG image · 1200 × 630</div></div>
    <div class="row">
      <div class="frame"><img src="../social/linkedin-banner-1584x396.svg" alt=""><div class="meta">LinkedIn · 1584 × 396</div></div>
      <div class="frame"><img src="../social/x-header-1500x500.svg" alt=""><div class="meta">X header · 1500 × 500</div></div>
    </div>
    <div class="row">
      <div class="frame"><img src="../social/email-signature-600x180.svg" alt=""><div class="meta">Email signature · 600 × 180</div></div>
      <div class="frame center"><img src="../social/avatar-square-512.svg" alt=""><div class="meta">Avatar · 512</div></div>
    </div>
  </div>
</div></body></html>
