<!doctype html>
<!-- @dsCard group="Brand" name="Logo · mark" subtitle="Element-42 tile · 6 modes" viewport="700x360" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tile.ink { background: #0E1116; }
  .tile .frame { padding: 18px; min-height: 130px; display: grid; place-items: center; }
  .tile .frame img { max-width: 100%; max-height: 100px; display: block; }
  .tile .label { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: #475; background: #fff; }
  .tile.ink .label { background: var(--paper); border-top-color: transparent; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="tile"><div class="frame"><img src="../logos/01-mark-with-phrase-light.svg" alt=""></div><div class="label">Mark · with phrase · light</div></div>
    <div class="tile ink"><div class="frame"><img src="../logos/02-mark-with-phrase-dark.svg" alt=""></div><div class="label">Mark · with phrase · dark</div></div>
    <div class="tile"><div class="frame"><img src="../logos/03-mark-no-phrase-light.svg" alt=""></div><div class="label">Mark · no phrase · light</div></div>
    <div class="tile ink"><div class="frame"><img src="../logos/04-mark-no-phrase-dark.svg" alt=""></div><div class="label">Mark · no phrase · dark</div></div>
    <div class="tile"><div class="frame"><img src="../logos/05-mark-mono-black.svg" alt=""></div><div class="label">Mono black · print</div></div>
    <div class="tile ink"><div class="frame"><img src="../logos/06-mark-mono-white.svg" alt=""></div><div class="label">Mono white · embroidery</div></div>
  </div>
</div></body></html>
