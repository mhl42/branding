<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="colors_and_type.css">
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 300px;width:1280px;height:854px}
.main{background:#0E1116;display:grid;place-items:center}
.main img{width:640px;height:auto;display:block}
.strip{display:grid;grid-template-rows:repeat(3,1fr);height:854px}
.strip div{width:100%;height:100%}
</style></head>
<body><div class="tile">
  <div class="main"><img src="logos/04-mark-no-phrase-dark.svg" alt="MHL · 42"></div>
  <div class="strip">
    <div style="background:#F5C518"></div>
    <div style="background:#FAF6EE"></div>
    <div style="background:#C9C3B5"></div>
  </div>
</div></body></html>
